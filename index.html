<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barra de subs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: #0a0a0f;
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: min(80vw, 920px);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .total {
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
    }

    .bar {
      position: relative;
      height: 84px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: #1c1c28;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }

    .segmentos {
      position: absolute;
      inset: 0;
      display: flex;
      height: 100%;
    }

    .segmento {
      flex: 0 0 auto;
      height: 100%;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset -2px 0 0 rgba(10, 10, 15, 0.9);
    }

    .pintura {
      height: 100%;
    }

    .label {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .panel {
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: #14141c;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .ordenes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .orden-titulo {
      margin-right: 4px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .panel h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .aviso {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.9rem;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.92rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: #0a0a0f;
      color: #fff;
      font: inherit;
    }

    .datos {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .objetivo {
      max-width: 180px;
    }

    .reto-form {
      display: grid;
      grid-template-columns: 1fr 140px auto;
      gap: 12px;
      align-items: end;
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
    }

    button[type="submit"] {
      height: 46px;
      padding: 0 18px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
      font-weight: 700;
    }

    .error {
      min-height: 1.2em;
      margin-top: 10px;
      color: #fb7185;
      font-size: 0.9rem;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      margin-top: 8px;
      overflow: auto;
      list-style: none;
    }

    .marca {
      width: 14px;
      height: 14px;
      border-radius: 999px;
    }

    .lista li {
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: #0a0a0f;
    }

    .cantidad,
    .soles {
      font-weight: 700;
    }

    .soles,
    .equivalencia {
      color: rgba(255, 255, 255, 0.72);
    }

    .equivalencia,
    .kick-estado {
      margin-top: 10px;
      font-size: 0.92rem;
    }

    .kick-estado {
      color: #86efac;
    }

    .acciones {
      display: flex;
      gap: 6px;
    }

    .lista input {
      margin-top: 0;
      padding: 8px 10px;
    }

    .editar-cantidad {
      width: 110px;
    }

    .mover,
    .quitar,
    .editar,
    .cancelar,
    .ordenar {
      padding: 8px 12px;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .guardar {
      padding: 8px 12px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
      font-weight: 700;
    }

    .ordenar[aria-pressed="true"] {
      border-color: transparent;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .vacio {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 700px) {
      .reto-form,
      .lista li {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <p class="total" id="total">0 de 100</p>
      <div
        class="bar"
        id="bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-valuetext="0%"
        aria-label="Progreso de retos"
      >
        <div class="segmentos" id="segmentos"></div>
        <span class="label" id="label">0%</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h1>Retos</h1>
      </div>
      <div class="ordenes">
        <span class="orden-titulo">Ordenar</span>
        <button type="button" class="ordenar" id="ordenar-asc" aria-pressed="true">Menor a mayor</button>
        <button type="button" class="ordenar" id="ordenar-desc" aria-pressed="false">Mayor a menor</button>
      </div>
      <div class="datos">
        <label class="objetivo">
          Objetivo por subs
          <input id="objetivo" type="number" min="1" step="any" value="100">
        </label>
        <label class="objetivo">
          Subs recibidos
          <input id="recibidos" type="number" min="0" step="any" value="0">
        </label>
      </div>
      <p class="kick-estado" id="kick-estado" hidden>Kick conectado. Las subs nuevas y las regaladas se suman solas.</p>

      <form class="reto-form" id="reto-form">
        <label>
          Reto por subs
          <input id="nombre" type="text" maxlength="80" autocomplete="off" placeholder="Escribe tu reto" required>
        </label>
        <label>
          Cantidad de subs
          <input id="cantidad" type="number" min="0" step="any" required>
        </label>
        <button type="submit">Agregar</button>
      </form>
      <p class="equivalencia" id="equivalencia">Cada sub vale S/ 18.64</p>
      <p class="error" id="error" role="alert"></p>
      <p class="vacio" id="vacio">Todavía no hay retos.</p>
      <p class="aviso" id="aviso" hidden>Orden manual. Pulsa «Menor a mayor» o «Mayor a menor» para volver a ordenar.</p>
      <ul class="lista" id="lista"></ul>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "barra-de-subs";
    const totalEl = document.getElementById("total");
    const barEl = document.getElementById("bar");
    const segmentosEl = document.getElementById("segmentos");
    const COLORES = ["#7c3aed", "#db2777", "#f97316", "#06b6d4", "#eab308", "#22c55e", "#f43f5e", "#6366f1"];
    const labelEl = document.getElementById("label");
    const objetivoEl = document.getElementById("objetivo");
    const recibidosEl = document.getElementById("recibidos");
    const kickEstadoEl = document.getElementById("kick-estado");
    const formEl = document.getElementById("reto-form");
    const nombreEl = document.getElementById("nombre");
    const cantidadEl = document.getElementById("cantidad");
    const VALOR_SUB_SOLES = 18.64;
    const errorEl = document.getElementById("error");
    const equivalenciaEl = document.getElementById("equivalencia");
    const vacioEl = document.getElementById("vacio");
    const avisoEl = document.getElementById("aviso");
    const ordenarAscEl = document.getElementById("ordenar-asc");
    const ordenarDescEl = document.getElementById("ordenar-desc");
    const listaEl = document.getElementById("lista");
    let arrastrado = null;
    let editandoId = null;

    const state = load();
    objetivoEl.value = String(state.objetivo);
    recibidosEl.value = String(state.recibidos);
    if (state.orden !== "manual") state.retos = ordenar(state.retos, state.orden);
    render();
    sincronizarKick();
    setInterval(sincronizarKick, 3000);

    async function sincronizarKick() {
      let respuesta;
      try {
        const origen = new URLSearchParams(location.search).get("kick");
        const destino = origen ? origen.replace(/\/$/, "") + "/api/contador" : "/api/contador";
        respuesta = await fetch(destino, { cache: "no-store" });
      } catch {
        return;
      }
      if (!respuesta.ok) return;
      const datos = await respuesta.json();
      const total = Number(datos && datos.total);
      if (!Number.isFinite(total) || total < 0) return;
      kickEstadoEl.hidden = false;
      if (state.kickVisto == null || total < state.kickVisto) {
        state.kickVisto = total;
        save();
        return;
      }
      if (total === state.kickVisto) return;
      state.recibidos += total - state.kickVisto;
      state.kickVisto = total;
      recibidosEl.value = String(state.recibidos);
      save();
      render();
    }

    ordenarAscEl.addEventListener("click", () => aplicarOrden("asc"));
    ordenarDescEl.addEventListener("click", () => aplicarOrden("desc"));

    objetivoEl.addEventListener("input", () => {
      const objetivo = Number(objetivoEl.value);
      if (!Number.isFinite(objetivo) || objetivo <= 0) return;
      state.objetivo = objetivo;
      save();
      render();
    });

    recibidosEl.addEventListener("input", () => {
      const recibidos = Number(recibidosEl.value);
      if (!Number.isFinite(recibidos) || recibidos < 0) return;
      state.recibidos = recibidos;
      save();
      render();
    });

    cantidadEl.addEventListener("input", () => {
      const cantidad = Number(cantidadEl.value);
      if (!Number.isFinite(cantidad) || cantidad <= 0) {
        equivalenciaEl.textContent = "Cada sub vale " + formatSoles(VALOR_SUB_SOLES);
        return;
      }
      equivalenciaEl.textContent = formatNumber(cantidad) + " subs = " + formatSoles(cantidad * VALOR_SUB_SOLES);
    });

    formEl.addEventListener("submit", (event) => {
      event.preventDefault();
      const nombre = nombreEl.value.trim();
      const cantidad = Number(cantidadEl.value);

      if (!nombre || !Number.isFinite(cantidad) || cantidad <= 0) {
        errorEl.textContent = "Escribe un reto y una cantidad mayor que 0.";
        return;
      }

      state.retos.push({
        id: crypto.randomUUID(),
        nombre,
        cantidad
      });
      if (state.orden !== "manual") state.retos = ordenar(state.retos, state.orden);
      editandoId = null;
      nombreEl.value = "";
      cantidadEl.value = "";
      errorEl.textContent = "";
      equivalenciaEl.textContent = "Cada sub vale " + formatSoles(VALOR_SUB_SOLES);
      save();
      render();
      nombreEl.focus();
    });

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const objetivo = Number(data && data.objetivo);
        const recibidos = Number(data && data.recibidos);
        const retos = Array.isArray(data && data.retos) ? data.retos : [];
        return {
          objetivo: Number.isFinite(objetivo) && objetivo > 0 ? objetivo : 100,
          recibidos: Number.isFinite(recibidos) && recibidos >= 0 ? recibidos : 0,
          kickVisto: data && Number.isFinite(Number(data.kickVisto)) ? Number(data.kickVisto) : null,
          orden: data && data.orden === "manual" ? "manual" : data && data.orden === "desc" ? "desc" : "asc",
          retos: retos
            .filter((reto) => reto && String(reto.nombre || "").trim() && Number(reto.cantidad) > 0)
            .map((reto) => ({
              id: reto.id || crypto.randomUUID(),
              nombre: String(reto.nombre).trim(),
              cantidad: Number(reto.cantidad)
            }))
        };
      } catch {
        return { objetivo: 100, recibidos: 0, kickVisto: null, orden: "asc", retos: [] };
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function suma() {
      return state.retos.reduce((total, reto) => total + reto.cantidad, 0);
    }

    function ordenar(retos, direccion) {
      const factor = direccion === "desc" ? -1 : 1;
      return retos
        .map((reto, index) => ({ reto, index }))
        .sort((a, b) => (a.reto.cantidad - b.reto.cantidad) * factor || a.index - b.index)
        .map((item) => item.reto);
    }

    function aplicarOrden(direccion) {
      editandoId = null;
      state.orden = direccion;
      state.retos = ordenar(state.retos, direccion);
      save();
      render();
    }

    function colorDe(index) {
      return COLORES[index % COLORES.length];
    }

    function mover(id, destino) {
      const origen = state.retos.findIndex((reto) => reto.id === id);
      if (origen < 0 || destino < 0 || destino >= state.retos.length || origen === destino) return;
      const [reto] = state.retos.splice(origen, 1);
      state.retos.splice(destino, 0, reto);
      state.orden = "manual";
      editandoId = null;
      save();
      render();
    }

    function guardarEdicion(id) {
      const reto = state.retos.find((item) => item.id === id);
      const nombreInput = listaEl.querySelector(".editar-nombre");
      const cantidadInput = listaEl.querySelector(".editar-cantidad");
      const nombre = nombreInput ? nombreInput.value.trim() : "";
      const cantidad = cantidadInput ? Number(cantidadInput.value) : NaN;

      if (!reto || !nombre || !Number.isFinite(cantidad) || cantidad <= 0) {
        errorEl.textContent = "Escribe un reto y una cantidad mayor que 0.";
        return;
      }

      reto.nombre = nombre;
      reto.cantidad = cantidad;
      if (state.orden !== "manual") state.retos = ordenar(state.retos, state.orden);
      editandoId = null;
      errorEl.textContent = "";
      save();
      render();
    }

    function render() {
      const pct = (state.recibidos / state.objetivo) * 100;
      const shown = Math.round(pct);
      let restante = Math.max(state.recibidos, 0);
      segmentosEl.replaceChildren();
      state.retos.forEach((reto, index) => {
        const pintado = Math.min(reto.cantidad, restante);
        restante -= pintado;
        const segmento = document.createElement("div");
        const pintura = document.createElement("div");
        segmento.className = "segmento";
        segmento.style.width = (reto.cantidad / state.objetivo) * 100 + "%";
        segmento.style.background = colorDe(index) + "33";
        pintura.className = "pintura";
        pintura.style.width = reto.cantidad > 0 ? (pintado / reto.cantidad) * 100 + "%" : "0%";
        pintura.style.background = colorDe(index);
        segmento.title = reto.nombre + " · " + formatNumber(pintado) + " de " + formatNumber(reto.cantidad) + " subs";
        segmento.append(pintura);
        segmentosEl.append(segmento);
      });
      const hueco = Math.max(state.objetivo - suma(), 0);
      const extra = Math.min(restante, hueco);
      if (extra > 0) {
        const segmento = document.createElement("div");
        const pintura = document.createElement("div");
        segmento.className = "segmento";
        segmento.style.width = (extra / state.objetivo) * 100 + "%";
        pintura.className = "pintura";
        pintura.style.width = "100%";
        pintura.style.background = "rgba(255, 255, 255, 0.55)";
        segmento.title = "Subs recibidos · " + formatNumber(extra);
        segmento.append(pintura);
        segmentosEl.append(segmento);
      }
      labelEl.textContent = shown + "%";
      barEl.setAttribute("aria-valuenow", String(Math.max(0, Math.min(shown, 100))));
      barEl.setAttribute("aria-valuetext", shown + "%");
      totalEl.textContent = "Recibidos " + formatNumber(state.recibidos) + " de " + formatNumber(state.objetivo) + " · " + formatSoles(state.recibidos * VALOR_SUB_SOLES);

      ordenarAscEl.setAttribute("aria-pressed", state.orden === "asc" ? "true" : "false");
      ordenarDescEl.setAttribute("aria-pressed", state.orden === "desc" ? "true" : "false");
      avisoEl.hidden = state.orden !== "manual" || state.retos.length === 0;

      listaEl.replaceChildren();
      state.retos.forEach((reto, index) => {
        const item = document.createElement("li");
        const marca = document.createElement("span");
        const editando = reto.id === editandoId;
        const nombre = document.createElement(editando ? "input" : "span");
        const cantidad = document.createElement(editando ? "input" : "span");
        const soles = document.createElement("span");
        const acciones = document.createElement("div");
        const subir = document.createElement("button");
        const bajar = document.createElement("button");
        const editar = document.createElement("button");
        const guardar = document.createElement("button");
        const cancelar = document.createElement("button");
        const quitar = document.createElement("button");

        item.draggable = !editando;
        item.addEventListener("dragstart", (event) => {
          arrastrado = reto.id;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", reto.id);
        });
        item.addEventListener("dragover", (event) => event.preventDefault());
        item.addEventListener("drop", (event) => {
          event.preventDefault();
          const id = event.dataTransfer.getData("text/plain") || arrastrado;
          const destino = state.retos.findIndex((actual) => actual.id === reto.id);
          arrastrado = null;
          mover(id, destino);
        });

        marca.className = "marca";
        marca.style.background = colorDe(index);
        soles.className = "soles";
        soles.textContent = formatSoles(reto.cantidad * VALOR_SUB_SOLES);
        acciones.className = "acciones";

        if (editando) {
          nombre.className = "editar-nombre";
          nombre.value = reto.nombre;
          nombre.maxLength = 80;
          cantidad.className = "editar-cantidad";
          cantidad.type = "number";
          cantidad.min = "0";
          cantidad.step = "any";
          cantidad.value = String(reto.cantidad);
          cantidad.addEventListener("input", () => {
            const valor = Number(cantidad.value);
            soles.textContent = Number.isFinite(valor) && valor > 0
              ? formatSoles(valor * VALOR_SUB_SOLES)
              : "";
          });
          [nombre, cantidad].forEach((campo) => {
            campo.addEventListener("keydown", (event) => {
              if (event.key === "Enter") {
                event.preventDefault();
                guardarEdicion(reto.id);
              }
            });
          });

          guardar.type = "button";
          guardar.className = "guardar";
          guardar.textContent = "Guardar";
          guardar.addEventListener("click", () => guardarEdicion(reto.id));

          cancelar.type = "button";
          cancelar.className = "cancelar";
          cancelar.textContent = "Cancelar";
          cancelar.addEventListener("click", () => {
            editandoId = null;
            errorEl.textContent = "";
            render();
          });

          acciones.append(guardar, cancelar);
        } else {
          nombre.textContent = reto.nombre;
          cantidad.className = "cantidad";
          cantidad.textContent = formatNumber(reto.cantidad) + " subs";

          subir.type = "button";
          subir.className = "mover";
          subir.textContent = "Subir";
          subir.disabled = index === 0;
          subir.addEventListener("click", () => mover(reto.id, index - 1));

          bajar.type = "button";
          bajar.className = "mover";
          bajar.textContent = "Bajar";
          bajar.disabled = index === state.retos.length - 1;
          bajar.addEventListener("click", () => mover(reto.id, index + 1));

          editar.type = "button";
          editar.className = "editar";
          editar.textContent = "Editar";
          editar.addEventListener("click", () => {
            editandoId = reto.id;
            errorEl.textContent = "";
            render();
            const campo = listaEl.querySelector(".editar-nombre");
            if (campo) campo.focus();
          });

          quitar.type = "button";
          quitar.className = "quitar";
          quitar.textContent = "Quitar";
          quitar.addEventListener("click", () => {
            editandoId = null;
            state.retos = state.retos.filter((item) => item.id !== reto.id);
            save();
            render();
          });

          acciones.append(subir, bajar, editar, quitar);
        }

        item.append(marca, nombre, cantidad, soles, acciones);
        listaEl.append(item);
      });

      vacioEl.hidden = state.retos.length > 0;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("es-PE", { maximumFractionDigits: 2 }).format(value);
    }

    function formatSoles(value) {
      return new Intl.NumberFormat("es-PE", {
        style: "currency",
        currency: "PEN",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value);
    }
  </script>
</body>
</html>
