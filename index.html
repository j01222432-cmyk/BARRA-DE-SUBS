<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barra de subs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: #0a0a0f;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bar {
      position: relative;
      width: min(80vw, 920px);
      height: 84px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: #1c1c28;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }

    .fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
    }

    .label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="bar" role="img" aria-label="100%">
    <div class="fill"></div>
    <span class="label">100%</span>
  </div>
</body>
</html>
